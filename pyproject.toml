[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superwireless"
version = "0.1.0"
description = "给 Agent 用的无线仿真信道供应站：标准化信道实例与物理测量量的 MCP 服务"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "structlog>=23.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
rt = ["sionna-rt"]          # Phase 2 射线追踪，会连带装 mitsuba + drjit
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
superwireless-mcp = "superwireless.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
