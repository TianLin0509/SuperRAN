rt_shenzhen_futian:
  label: 射线追踪 · 深圳福田 CBD
  summary: 真实 OSM 建筑，6 站 18 小区，130 栋楼平均 41.5 m。首次使用自动准备资产。
  typical_for: [密集城区验证, 覆盖分析, 干扰研究]
