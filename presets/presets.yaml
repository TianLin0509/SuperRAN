    num_ues: 12
    num_bs_tx_ant: 16
    num_bs_rx_ant: 16
    num_ue_tx_ant: 2
    num_ue_rx_ant: 2
    bandwidth_hz: 100000000.0
    subcarrier_spacing: 30000
    carrier_freq_hz: 2000000000.0
    link: DL
    channel_est_mode: ls_linear
