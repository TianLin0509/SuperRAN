    source: sionna_rt
    scene: shenzhen_futian
    channel_model: TDL-C
    num_ues: 12
    num_bs_tx_ant: 64
    num_bs_rx_ant: 64
    num_ue_tx_ant: 4
    num_ue_rx_ant: 4
