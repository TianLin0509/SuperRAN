# 系统级场景预设 —— 一整套仿真条件打包成一个名字。
#
# 结构：channel_preset（复用信道预设，不重新定义）+ generate（生成覆盖）
#      + system（sr_system_sim 参数）+ expect（实测锚点）
#
# 两条硬规矩：
# 1. expect 只写**实测过**的值，measured: false 时不许拿设计意图充数。
#    CLAUDE.md：「preset 里的 label 是设计意图，写着「高干扰」实际只有 2 dB 的事发生过」
# 2. pair_with 声明的对照组，除了 pair_varies 列出的那几项，其余必须逐字相同。
#    sysscenes.check_pairs() 会强制校验——同时差三四个参数的两个场景不是对照组。
#
# 所有场景都要求每 UE 的有效快照数
# num_slots_per_sample * num_samples / num_ues >= 8。当前推荐 num_slots_per_sample=1
# 且每 UE 至少 8 个样本，以绕开外部 ChannelHub 多时隙 SIR/SINR 聚合口径尚未统一的问题。
# 2026-08-07 的数值锚点全部来自 physics audit 前的 legacy_v1，仅用于历史回归，
# 不得当成 2026-08-09 修正后实现的当前验收值；expect.model_version 会显式标记。

# ---------------------------------------------------------------------------
# 一、负载对照组：满载 vs 轻载
# ---------------------------------------------------------------------------
sys_dense_urban_loaded:
  group: 系统级 · 负载对照
  label: 密集城区满负载 · 21 小区 ISD 150 m · 邻区 90%
  summary: >-
    现网密集城区的高干扰工况，ISD 150 m、邻区 PRB 利用率 0.9 接近满负载。
    **别拿它看 IoT**：这个场景要求多时隙（PF 分集与 CSI 老化的前提），
    而多时隙下 IoT 的两个输入量口径不一致，算出来是坏的——
    详见 expect.note。要看 IoT 请单独生成一批 num_slots_per_sample=1 的。
  answers:
    - 密集城区满负载下用户实际体验到多快
    - 边缘用户被压到什么程度
    - 满载与轻载的体验差多少（与 sys_dense_urban_light 配对）
  channel_preset: high_iot_dense
  pair_with: sys_dense_urban_light
  pair_varies: [neighbor_prb_util, arrival_rate_hz]
  generate:
    num_ues: 10
    num_samples: 80
    num_slots_per_sample: 8
    ue_speed_kmh: 3.0
  system:
    duration_s: 3.0
    traffic_model: ftp3
    arrival_rate_hz: 3.0
    neighbor_prb_util: 0.9
    csi_aging: true
    srs_period_ms: 10.0
  expect:
    measured: false
    invalidated_by: >-
      2026-09-03 合并容量/体验模式：legacy_v1 全带路径删除，所有场景改走
      experience_v2（容量口径 = traffic_model: full_buffer）。下面的数字是
      legacy_v1 测的，口径已变，**不再成立**。重跑 sr_probe_scenario 后再填。
    model_version: experience_v2
    dataset: ds_9625340c
    n_replications: 8
    # 格式一律是 [均值, 95% 区间半宽占均值的百分比]。**半宽和数值不可分割**——
    # 单独引用均值就是在假装这次实验的分辨率无限高。
    note: >-
      2026-08-07 实测，8 次重复。**IoT 故意不记**：这个数据集
      num_slots_per_sample=8，而多时隙下 sinr_dB 是各 slot 的 dB 均值、
      sir_dB 只取最后一个 slot，两者不同口径——实测 sir−sinr 中位是 -0.53 dB
      （物理上必须为正），80 个样本 43 个算不出 IoT。
      信道预设 high_iot_dense 的 expect 写着 iot_dl_db 35.76（单时隙探测测的），
      系统级同配置算出来 2.19 dB，**差 33 dB，那个 2.19 是坏的不是低的**。
      **多时隙又是 PF 分集与 CSI 老化的前提，所以这两个需求当前无法在
      同一个数据集上同时满足**，要看 IoT 得单独生成一批单时隙的。
      体验速率两项半宽超过 20%，只能读量级，要收窄得加长 duration_s 或加重复次数。

sys_dense_urban_light:
  group: 系统级 · 负载对照
  label: 密集城区轻载 · 同拓扑 · 邻区 10%
  summary: >-
    与 sys_dense_urban_loaded **同一批信道、同一撒点**，只把邻区负载降到 0.1、
    话务到达率降低。两者之差就是负载本身的代价，不混其他因素。
  answers:
    - 负载从 10% 涨到 90%，体验速率掉多少
    - 轻载时是不是噪声受限
  channel_preset: high_iot_dense
  pair_with: sys_dense_urban_loaded
  pair_varies: [neighbor_prb_util, arrival_rate_hz]
  generate:
    num_ues: 10
    num_samples: 80
    num_slots_per_sample: 8
    ue_speed_kmh: 3.0
  system:
    duration_s: 3.0
    traffic_model: ftp3
    arrival_rate_hz: 1.0
    neighbor_prb_util: 0.1
    csi_aging: true
    srs_period_ms: 10.0
  expect:
    measured: false
    invalidated_by: >-
      2026-09-03 合并容量/体验模式：legacy_v1 全带路径删除，所有场景改走
      experience_v2（容量口径 = traffic_model: full_buffer）。下面的数字是
      legacy_v1 测的，口径已变，**不再成立**。重跑 sr_probe_scenario 后再填。
    model_version: experience_v2
    dataset: ds_9625340c
    n_replications: 8
    note: >-
      2026-08-07 实测，8 次重复。与 sys_dense_urban_loaded 同一批信道。
      **注意方向**：轻载的体验速率(106) 高于满载(33)，而承载吞吐(33) 低于满载(87)
      ——体验速率衡量的是"轮到我时有多快"，满载时人人都在排队。
      **拿这两个场景对比时必须用公共随机数**（两臂同一批 replication 流），
      否则 5% 边缘那一项 38% 的半宽会把差异整个淹掉。
      IoT 同样不记，原因见对照组。

# ---------------------------------------------------------------------------
# 二、CSI 时延对照组：现网 SRS 配置 vs 零时延上界
# ---------------------------------------------------------------------------
sys_urban_macro_field_csi:
  group: 系统级 · CSI 时延对照
  label: 城区宏站 · 现网 SRS 配置（10 ms + 17 倍跳频）
  summary: >-
    38.211 Table 6.4.1.4.3-1 的 C_SRS=63：每跳 16 RB 正好一个 RBG，
    17 跳扫完 272 RB。10 ms 周期下全带扫一遍要 170 ms，
    平均 CSI 陈旧时长 87 ms——**这是默认配置，也是现网的样子**。
  answers:
    - 现网 SRS 配置下体验速率是多少
    - CSI 老化吃掉了多少
  channel_preset: company_64t4r_multicell
  pair_with: sys_urban_macro_ideal_csi
  pair_varies: [csi_aging]
  generate:
    num_ues: 10
    num_samples: 80
    num_slots_per_sample: 8
    ue_speed_kmh: 30.0
  system:
    duration_s: 3.0
    traffic_model: ftp3
    arrival_rate_hz: 2.0
    neighbor_prb_util: 0.3
    csi_aging: true
    srs_period_ms: 10.0
  expect:
    measured: false
    invalidated_by: >-
      2026-09-03 合并容量/体验模式：legacy_v1 全带路径删除，所有场景改走
      experience_v2（容量口径 = traffic_model: full_buffer）。下面的数字是
      legacy_v1 测的，口径已变，**不再成立**。重跑 sr_probe_scenario 后再填。
    model_version: experience_v2
    dataset: ds_984082de
    n_replications: 8
    note: >-
      2026-08-07 实测，8 次重复。**替换了 2026-08-04 的单次运行值，
      而且替换本身就是这项工作的价值证明**：旧的单次值 5% 边缘是 123.5，
      新的 8 次均值是 101.3 —— 偏了 22%，是半宽的两倍，那次单跑抽到了离群样本。
      与零时延对照组的差是 -52.7%，远大于两边各自 6~9% 的半宽，
      **所以「CSI 老化吃掉一半体验速率」这个结论依然站得住**。

sys_urban_macro_ideal_csi:
  group: 系统级 · CSI 时延对照
  label: 城区宏站 · 零时延完美 CSI（上界，不是现网）
  summary: >-
    与 sys_urban_macro_field_csi **除 csi_aging 外逐字相同**。
    预编码与评估用同一个信道矩阵——**这是上界不是现网**，
    它会系统性高估 MU 增益，只用来量"老化吃掉了多少"。
  answers:
    - CSI 老化的代价有多大（拿它当分母）
  channel_preset: company_64t4r_multicell
  pair_with: sys_urban_macro_field_csi
  pair_varies: [csi_aging]
  generate:
    num_ues: 10
    num_samples: 80
    num_slots_per_sample: 8
    ue_speed_kmh: 30.0
  system:
    duration_s: 3.0
    traffic_model: ftp3
    arrival_rate_hz: 2.0
    neighbor_prb_util: 0.3
    csi_aging: false
    srs_period_ms: 10.0
  expect:
    measured: false
    invalidated_by: >-
      2026-09-03 合并容量/体验模式：legacy_v1 全带路径删除，所有场景改走
      experience_v2（容量口径 = traffic_model: full_buffer）。下面的数字是
      legacy_v1 测的，口径已变，**不再成立**。重跑 sr_probe_scenario 后再填。
    model_version: experience_v2
    dataset: ds_984082de
    n_replications: 8
    note: >-
      2026-08-07 实测，8 次重复。**olla_db_mean 那 58.9% 不是这一项不可信**——
      均值只有 -0.27，相对半宽的分母太小，绝对半宽其实只有 0.16 dB。
      **接近零的量一律看绝对区间，别看相对半宽。**
      零时延下 OLLA 本就该贴近 0（发送侧估计准，外环没什么要修的），
      这和现网配置那边被压到 -4.21 dB 正好互为印证。

# ---------------------------------------------------------------------------
# 三、现网话务画像
# ---------------------------------------------------------------------------
sys_field_bimodal_traffic:
  group: 系统级 · 话务
  label: 现网话务画像 · 两头高中间低（30% 小包 / 30% 满包）
  summary: >-
    用户给的现网口径：小包约占 30%、满包约占 30%、中间相对均匀。
    **口径已迁移**：退役的 bimodal 是"按占用 RBG 数"抽样再乘一个写死的
    3.0 bit/s/Hz 折成字节；现在改成 cdf 驱动的**包长分布**，
    一次传输实际占几个 RBG 由该用户当时的 MCS/rank 经 TBS 反查决定。
    两份 CDF 由 scripts/make_field_bimodal_cdf.py 机械转写自原旋钮，
    **不是新的现网测量**。小包不再是盲区：Rel-19 的 fractional-slot 口径可测。
  answers:
    - 现网话务下 PRB 利用率是多少
    - 大包用户和小包用户的体验差多少
  channel_preset: company_64t4r_multicell
  generate:
    num_ues: 10
    num_samples: 80
    num_slots_per_sample: 8
    ue_speed_kmh: 3.0
  system:
    duration_s: 5.0
    traffic_model: cdf
    packet_size_cdf: presets/traffic_cdf/field_bimodal_packet_size.csv
    interarrival_cdf: presets/traffic_cdf/field_bimodal_interarrival.csv
    neighbor_prb_util: 0.3
    csi_aging: true
  expect:
    measured: false
    invalidated_by: >-
      2026-09-03 合并容量/体验模式：legacy_v1 全带路径删除，所有场景改走
      experience_v2（容量口径 = traffic_model: full_buffer）。下面的数字是
      legacy_v1 测的，口径已变，**不再成立**。重跑 sr_probe_scenario 后再填。
    model_version: experience_v2
    dataset: ds_6e9715bc
    n_replications: 8
    note: >-
      2026-08-07 实测，8 次重复。**首传 BLER 0.883 不是笔误，是这个场景的真实
      失效模式**：小包 burst 太小，占用率只有 10.7%，5 秒里 OLLA 拿不到足够的
      ACK/NACK 就永远收敛不了（偏置才压到 -2.05 dB，稳态需要更负）。
      **这个场景当前不能用来下 BLER 或体验速率的结论**——
      体验速率两项半宽 49% 与 84%，本身也分辨不出来。
      要让它可用：加长 duration_s 到 20 秒以上，或临时开 olla_speedup。
      另：折合 PRB 利用率 37.1% vs 现网口径 30%，差在 2~16 均匀分布的均值偏高，
      **这个参数还没对齐**（调 p_idle_tti 没用，它不驱动仿真）。

# ---------------------------------------------------------------------------
