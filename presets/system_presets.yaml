    sys_multicell_center_cell 直接比——那一个实测 IoT 23.2 dB。
    体验类标准 KPI 按 TS 28.552 定义无样本（buffer 永不排空），报 None；
    容量口径看 cell_served_mbps 与 ITU 口径的 ue_served_p5_mbps。
