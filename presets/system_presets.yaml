      **半宽全部 <= 1.4%**：full buffer 没有话务随机性，唯一随机源是 HARQ 抽样。
      自闭环核对三条都过：① 首传 BLER 0.0884 = 10% 目标的 0.88 倍；
      ② ue_served_mean 61.868 与 active_window_goodput 61.968 是两条独立路径
