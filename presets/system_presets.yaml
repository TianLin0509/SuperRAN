      experience_v2（容量口径 = traffic_model: full_buffer）。下面的数字是
      legacy_v1 测的，口径已变，**不再成立**。重跑 sr_probe_scenario 后再填。
    model_version: experience_v2
    dataset: ds_329edafb
    result: artifacts/results/experience_pf_accounting_crn_n16.json
    n_replications: 16
    large_burst_drb_throughput_mbps: [169.7562, 8.55]
    resource_utilization: [0.7741, 9.46]
    accounting_error_pct: 0.0
    note: >-
      2026-08-09 原理修复后正式 n=16 CRN。主指标 small FIFO 排队 P95：本臂
      0.5625 ms，故障注入臂 1.2109 ms，配对差 -0.6484 ms，95% CI
      [-0.9616,-0.3352]，Wilcoxon p=0.00322，门3通过。完成时延差
      -1.4937 ms、PDB miss 差 -0.0072 也通过。预注册外的 secondary 大 burst
      吞吐名义差 +2.7104 Mbps、CI [0.5181,4.9027]，未做多重性校正，不升级成
      主结论；资源利用率、总承载和积压不显著。两臂 32 次运行字节对账均为 0。

sys_experience_mixed_pf_wrong_accounting:
  group: 系统级 · 体验模式 PF 记账
  label: 大小文件混跑 · legacy full-band PF（故障注入）
