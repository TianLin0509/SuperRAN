# ---------------------------------------------------------------------------
# 九、合并后单路径的实测锚点
#
# 这一节的场景是**按 OLLA 收敛需求重新设计过的**，不是把旧场景照搬。
# 判据来自物理而不是经验：外环的稳态 BLER 恒等于 step_up/(step_up+step_down)，
# 默认 0.01/0.09 就是 10%。所以「实测首传 BLER 落在 10% 附近」= 场景给够了反馈；
# 落不到就是场景太短或太闲，该调场景，不该调断言。
#
# 实测：跨 1 档 MCS 需要 100 次连续 ACK。旧配置每 UE 只被调度约 280 次，
# 冷启动走不到稳态（BLER 实测 2.4~3.2 倍目标）。把占用率从 0.2x 抬到 0.4~0.6，
# 每 UE 约 1100 次，四个场景分别落到 0.88 / 1.12 / 1.34 / 1.04 倍。
#
# **反例（已实测，勿重蹈）**：用 olla_warmup_speedup=10 "加速收敛" 会把 BLER
# 打到 0.64 倍。步长比例 up:down = 1:9 不对称，预热期 10 倍大步向下过冲后，
# 测量期每次 ACK 只能爬 0.01，爬不回来。正确解法是补足反馈量，不是调学习率。
#
# **合并 #23（BLER/EESM 显式化、S 时隙折算、SU/MU 准入门）后逐字重测过**：
# 四个场景共 69 项指标（16+18+17+18）**一个都没变**。原因可查：这四个锚点都是
# SU、都用预置 MCS 表 3、TDD 图案都不含 S 时隙，而 #23 动的是表 1/2 的解析 BLER、
# S 时隙折算系数与 MU 配对准入——与这些锚点物理正交。**这一致本身就是证据**，
# 不是"没跑"。
# ---------------------------------------------------------------------------
sys_single_cell_capacity:
  group: 系统级 · 单小区基线
