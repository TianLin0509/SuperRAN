# ---------------------------------------------------------------------------
# 五、容量上界（不看体验速率）
# ---------------------------------------------------------------------------
sys_capacity_full_buffer:
  group: 系统级 · 容量上界
  label: 容量仿真 · 话务开到最大（full buffer）
  summary: >-
    **"容量仿真"就是这个场景**：它不是另一条仿真分支，只是把话务开到最大。
    缓冲区永不空 ⇒ 按需 RBG 反查恒等于全带宽、每 TTI 一个 SU（或一对 MU），
    调度、AMC、HARQ、解调 SINR 聚合全部照体验口径走。
    满缓冲下 TS 28.552 的标准样本一个都不形成（样本只在 buffer 排空事件上形成），
    drb_throughput_rel19_mbps / cell_experienced_mbps 报 None——定义使然，不是缺陷。
    看工程口径：ITU 的 ue_served_p5_mbps 与 active_window_goodput_mbps，
    两者算法不同但应收敛。其余需要 burst 真的传完的键同样报 None（完成时延、PDB、
    含头速率）。结果里引用 cell_served_mbps、ue_served_p5_mbps、
    active_window_goodput_mbps、PRB 利用率与 Jain 公平度。
  answers:
    - 这个小区的吞吐上界是多少
    - PF 在满负载下的公平性如何
  channel_preset: company_64t4r_multicell
  generate:
    num_ues: 10
    num_samples: 80
    num_slots_per_sample: 8
    ue_speed_kmh: 3.0
  system:
    duration_s: 3.0
    traffic_model: full_buffer
    neighbor_prb_util: 0.3
    csi_aging: true
  expect:
    measured: false
    invalidated_by: >-
      2026-09-03 合并容量/体验模式：legacy_v1 全带路径删除，所有场景改走
      experience_v2（容量口径 = traffic_model: full_buffer）。下面的数字是
      legacy_v1 测的，口径已变，**不再成立**。重跑 sr_probe_scenario 后再填。
    model_version: experience_v2
    dataset: ds_6e9715bc
    n_replications: 8
    note: >-
      2026-08-07 实测，8 次重复（数值已因口径变更作废，见 invalidated_by）。
      **体验速率是 None**：full buffer 下缓冲区永不清空，28.552 的 DRB
      合并前的 legacy 路径报的是 0，
      那是在假装"测到了 0 Mbps"；现在报 None 并在 notes 里说明。
      **别把它当成 bug 去修。**
      注意所有区间都极窄（≤0.2%）——因为 full buffer 没有话务随机性，
      唯一的随机源只剩 HARQ 抽样。**这反过来说明其他场景那些宽区间主要来自话务**。

# ---------------------------------------------------------------------------
