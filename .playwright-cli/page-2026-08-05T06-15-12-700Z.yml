      - heading "现在就能看懂：为什么一定要维护这些字段" [level=3] [ref=e309]
      - generic [ref=e310]:
        - generic [ref=e311]:
          - strong [ref=e312]: 服务 beam mask
          - text: 告诉本小区“我正在保护哪个接收方向”。它只在本地用，没必要发给邻居。
        - generic [ref=e313]:
          - strong [ref=e314]: victimBeamMask
          - text: 告诉邻居“我的 UE 在你的坐标系落在哪里”。这是跨区判断不可缺的最小空间信息。
        - generic [ref=e315]:
          - strong [ref=e316]: intfClass
          - text: 避免把一个很远 UE 与一个近场高功率 UE 等价处理；方向错开也要结合强弱。
        - generic [ref=e317]:
          - strong [ref=e318]: confidence / age
          - text: 防止用过期 beam index 做乐观复用。越不确定，mask 越扩张、风险越保守。
        - generic [ref=e319]:
          - strong [ref=e320]: CDM mask
          - text: 告诉对方同一格里哪些码已经占用；码域是容量，不是跨小区绝对正交保证。
        - generic [ref=e321]:
          - strong [ref=e322]: movable + epoch + conflict bitmap
          - text: 解决“谁让路、何时生效、另一侧是否同意”，避免两个小区同时反复搬家。
