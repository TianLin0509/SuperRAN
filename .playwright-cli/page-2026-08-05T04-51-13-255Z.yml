          - heading "调度不是“每 20 ms 全重算”" [level=3] [ref=e302]
          - paragraph [ref=e303]: 资源图可复用多个 20 ms 周期。建议起点是 100–500 ms 事件/增量更新，1 s 全量校准；高移动或低置信度用户直接退回保守策略。
