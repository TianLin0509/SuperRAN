        - generic [ref=e298]:
          - heading "消息不是“逐 UE 消息”" [level=3] [ref=e299]
          - paragraph [ref=e300]: 无论一个格里有 1 个还是多个码分 UE，对某一受害邻区都压成 beam mask + max risk + CDM mask，一个 entry 固定 16 bit。
