      - paragraph [ref=e153]: 推荐把方案命名为 Directional Spatial SRS Map（D-SSRM，方向性空域 SRS 图）。每条邻区边单独维护一份 8 格地图，消息从 B→A 时只描述“B 当前占用每格的 UE，在 A 看来落在哪些 SSB 波束上”。
