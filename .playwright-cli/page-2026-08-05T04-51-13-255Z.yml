        - generic [ref=e269]:
          - heading "每个 UE 对 8 个候选格打分" [level=3] [ref=e270]
          - generic [ref=e271]: Cost_c(u,r) = Σ_n q_(n→c,r) · max L_c[a,b] + λ_switch · I(r ≠ r_old) + λ_CDM · codeRisk(r)其中 a ∈ servingBeamMask_c(u)，b ∈ victimBeamMask_(n→c,r)
          - list [ref=e272]:
            - listitem [ref=e273]: Σ 邻区：不能只看最强一个邻区后忽略多个中等干扰的叠加。
            - listitem [ref=e274]: 切换惩罚：给当前资源一个“粘性”，避免用户与小区来回抖动。
            - listitem [ref=e275]: 码域惩罚：码分优先在同小区内排，跨小区只作为附加自由度。
      - heading "分布式、无中心联合优化的 6 步闭环" [level=3] [ref=e276]
      - generic [ref=e277]:
        - generic [ref=e278]:
          - strong [ref=e279]: 筛邻区。
          - text: 只保留 poolId 相同 且预测跨区 SRS 耦合超过进入门限的邻区；退出用更低门限，形成迟滞。
        - generic [ref=e280]:
          - strong [ref=e281]: 本地建 UE 标签。
          - text: 服务 beam mask、对每个有害邻区的 victim-beam mask、2-bit 干扰等级、置信度与年龄。
        - generic [ref=e282]:
          - strong [ref=e283]: 聚合成方向性地图。
          - text: 对每个资源格，把其上 UE 对某个受害邻区的 beam mask 做 OR，干扰等级取 max，CDM 形成 occupancy mask。
        - generic [ref=e284]:
          - strong [ref=e285]: 交换 8-entry D-SSRM。
          - text: 不带 UE 身份；收到后，本地 UE 对 8 格独立评分，先用带粘性的贪心/最小代价匹配即可。
        - generic [ref=e286]:
          - strong [ref=e287]: 确定谁让路。
          - text: 冲突资源的 owner 可由 hash(NCGI-A, NCGI-B, resource, epoch) 双方独立算出；非 owner 优先移动，epoch 轮换保证长期公平。
        - generic [ref=e288]:
          - strong [ref=e289]: 闭环校准。
          - text: 受害小区用实际 SRS 后合并 SINR、估计 NMSE 或污染告警更新本地 L
          - subscript [ref=e290]: c
          - text: ；持续冲突可回 1-byte conflict bitmap。
