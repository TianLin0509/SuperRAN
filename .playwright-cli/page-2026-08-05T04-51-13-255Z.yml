    - generic [ref=e234]:
      - generic [ref=e235]: 04 · 决策算法
      - heading "用“软泄漏矩阵”替代“相同/不同”二值规则" [level=2] [ref=e236]
      - paragraph [ref=e237]: SSB 是宽波束代理，不是接收波束的硬正交基。相邻 beam、旁瓣、阵列安装误差和 UE 波束都会让“index 不同”仍有干扰，因此应在每个受害小区本地维护一个很小的 4×4 风险矩阵。
