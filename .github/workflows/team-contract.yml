name: team-contract

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate role Skills, pages, prompts, and repository contract
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: python scripts/validate_team_contract.py
      - name: Exercise role-scoped Skill installer
        env:
          PYTHONUTF8: "1"
        run: python scripts/install_agent_skills.py --role lead --codex-home "${RUNNER_TEMP}/codex-home"
